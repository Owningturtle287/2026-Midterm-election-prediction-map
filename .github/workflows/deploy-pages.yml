name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package atlas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript
        run: node --check dist/app.js
      - name: Validate forecast and district geography
        run: node scripts/validate.cjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload atlas
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publish atlas
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Show site link in run summary
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo '## Midterm Atlas is live'
            echo
            echo "[Open the interactive atlas](${PAGE_URL})"
            echo
            echo 'This deployment contains the validated forecast and all state and district maps.'
          } >> "$GITHUB_STEP_SUMMARY"
